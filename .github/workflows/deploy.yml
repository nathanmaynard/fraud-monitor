name: Deploy to Cloud Run
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SERVICE: fraud-monitor
  REGION: europe-west2   # London

jobs:
  deploy:
    # Skipped until the repo variable DEPLOY_ENABLED=true is set (Settings → Variables → Actions)
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.11 && uv sync
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Pull dataset from private bucket
        run: gcloud storage cp gs://${{ vars.DATA_BUCKET }}/Base.csv data/raw/Base.csv
      - name: Retrain, monitor, and export app slice
        run: uv run fm all
      - name: Fairness gate (real data)
        run: |
          uv run python - <<'PY'
          import json
          s = json.load(open("reports/monitor_summary.json"))
          print(json.dumps(s, indent=2))
          assert s["fairness_fpr_ratio"] < 3.0, "FPR gap between age groups too large — not deploying"
          PY
      - name: Deploy
        run: >
          gcloud run deploy $SERVICE --source . --region $REGION --project ${{ vars.GCP_PROJECT_ID }}
          --allow-unauthenticated --memory 1Gi --cpu 1 --max-instances 2 --quiet
      - name: Upload monitoring reports
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-reports
          path: reports/
